<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookie Wheel</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#4b1fa8,#7d4dff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}
.box{text-align:center}
.pointer{
font-size:42px;
color:#ff5252;
margin-bottom:8px;
}
#wheel{
width:300px;
height:300px;
margin:auto;
border-radius:50%;
border:10px solid white;
background:
conic-gradient(
#ffb74d 0% 45%,
#ffd54f 45% 50%,
#fff176 50% 55%,
#ffe082 55% 60%,
#fff59d 60% 65%,
#90caf9 65% 70%,
#64b5f6 70% 75%,
#4fc3f7 75% 80%,
#81c784 80% 85%,
#ba68c8 85% 90%,
#b39ddb 90% 95%,
#b0bec5 95% 100%);
box-shadow:0 10px 25px rgba(0,0,0,.35);
transition:transform 5s cubic-bezier(.18,.85,.15,1);
}
button{
margin-top:25px;
padding:14px 36px;
font-size:22px;
border:none;
border-radius:10px;
background:#00c853;
color:white;
cursor:pointer;
}
#result{
margin-top:25px;
font-size:30px;
font-weight:bold;
min-height:40px;
}
</style>
</head>
<body>
<div class="box">
<div class="pointer">▼</div>
<div id="wheel"></div>
<button id="spin">SPIN</button>
<div id="result"></div>
</div>
<script>
const sRank=[
"Pure Vanilla Cookie","Hollyberry Cookie","Dark Cacao Cookie",
"Golden Cheese Cookie","White Lily Cookie","Moonlight Cookie"
];
const others=[
"GingerBrave","Cherry Cookie","Wizard Cookie",
"Strawberry Cookie","Carrot Cookie"
];
let used=false;
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById("spin").onclick=function(){
if(used){alert("One spin only!");return;}
used=true;
const deg=360*8+Math.random()*360;
document.getElementById("wheel").style.transform="rotate("+deg+"deg)";
setTimeout(()=>{
let r=Math.random(),txt="";
if(r<0.45) txt="🥔 Mashed Potato Cookie";
else if(r<0.75) txt="⭐ "+rand(sRank);
else txt="🍪 "+rand(others);
document.getElementById("result").textContent=txt;
},5000);
}
</script>
</body>
</html>
