<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookie Wheel</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#5b2db8;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff}
.wrap{text-align:center}
canvas{background:#fff;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
button{margin-top:20px;padding:14px 32px;font-size:20px;border:none;border-radius:10px;background:#00c853;color:#fff;cursor:pointer}
#result{margin-top:20px;font-size:28px;font-weight:bold}
.arrow{font-size:42px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="arrow">▼</div>
<canvas id="wheel" width="420" height="420"></canvas><br>
<button id="spin">SPIN</button>
<div id="result"></div>
</div>
<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const segs=[
{label:"Mashed Potato Cookie",w:45,color:"#ffb74d"},
{label:"Pure Vanilla Cookie",w:5,color:"#ffd54f"},
{label:"Hollyberry Cookie",w:5,color:"#ffe082"},
{label:"Dark Cacao Cookie",w:5,color:"#ffecb3"},
{label:"Golden Cheese Cookie",w:5,color:"#fff59d"},
{label:"White Lily Cookie",w:5,color:"#fff176"},
{label:"Moonlight Cookie",w:5,color:"#fff9c4"},
{label:"GingerBrave",w:5,color:"#90caf9"},
{label:"Cherry Cookie",w:5,color:"#64b5f6"},
{label:"Strawberry Cookie",w:5,color:"#42a5f5"},
{label:"Wizard Cookie",w:5,color:"#2196f3"},
];
let angle=0,spinning=false;
function draw(){
ctx.clearRect(0,0,420,420);
let start=angle;
for(const s of segs){
let a=s.w/100*Math.PI*2;
ctx.beginPath();
ctx.moveTo(210,210);
ctx.arc(210,210,200,start,start+a);
ctx.closePath();
ctx.fillStyle=s.color;
ctx.fill();
ctx.save();
ctx.translate(210,210);
ctx.rotate(start+a/2);
ctx.textAlign="right";
ctx.fillStyle="#222";
ctx.font="13px Arial";
ctx.fillText(s.label,185,5);
ctx.restore();
start+=a;
}
}
draw();
function weightedPick(){
let r=Math.random()*100,sum=0;
for(let i=0;i<segs.length;i++){sum+=segs[i].w;if(r<sum)return i;}
return 0;
}
document.getElementById("spin").addEventListener("click",()=>{
if(spinning)return;
spinning=true;
document.getElementById("result").textContent="";
const idx=weightedPick();
let start=0,targetCenter=0;
for(let i=0;i<idx;i++)start+=segs[i].w/100*Math.PI*2;
targetCenter=start+segs[idx].w/100*Math.PI;
let final=-(targetCenter)+Math.PI*1.5+Math.PI*2*6;
let begin=angle,dur=5000,t0=null;
function anim(ts){
if(!t0)t0=ts;
let p=Math.min((ts-t0)/dur,1);
let e=1-Math.pow(1-p,3);
angle=begin+(final-begin)*e;
draw();
if(p<1)requestAnimationFrame(anim);
else{
spinning=false;
document.getElementById("result").textContent="🎉 "+segs[idx].label;
}
}
requestAnimationFrame(anim);
});
</script>
</body>
</html>
